[package]
name = "the-converter"
version = "0.1.0"
edition = "2024"
description = "Conversioni locali di audio, video, immagini e PDF, integrate in Windows"
authors = ["Salvatore Corsi"]
build = "build.rs"
default-run = "the-converter"

[lib]
name = "the_converter"
path = "src/lib.rs"

[[bin]]
name = "the-converter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
directories = "6"
fs2 = "0.4"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
lopdf = "0.38"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
which = "8"
url = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(not(windows))'.dependencies]
open = "5"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

