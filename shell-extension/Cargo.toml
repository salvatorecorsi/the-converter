[package]
name = "the-converter-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Per-user Windows Explorer IExplorerCommand integration for The Converter"

[lib]
name = "the_converter_shell"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

# This crate can be built on its own, outside the main application's workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
